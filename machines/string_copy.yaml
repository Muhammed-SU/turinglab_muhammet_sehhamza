name: "string_copy"
description: "Verilen dizgiyi kopyalar. Örnek: abba -> abba#abba"
states: [q0, q_match_a, q_match_b, q_move_right_a, q_move_right_b, q_return, q_clean, q_accept]
input_alphabet: ["a", "b"]
tape_alphabet: ["a", "b", "B", "#", "A", "B'"]
blank: "B"
start_state: q0
accept_states: [q_accept]
reject_states: []
transitions:
  # İlk işlenmemiş karakteri bul, işaretle (a->A, b->B') ve sağa doğru taşımaya başla
  - {state: q0, read: "a", next: q_match_a, write: "A", move: R}
  - {state: q0, read: "b", next: q_match_b, write: "B'", move: R}
  - {state: q0, read: "#", next: q_clean, write: "#", move: L} # Tüm karakterler bittiğinde temizliğe geç

  # 'a' harfini kopyalamak için sağa, '#' işaretinin sonrasına ilerle
  - {state: q_match_a, read: "a", next: q_match_a, write: "a", move: R}
  - {state: q_match_a, read: "b", next: q_match_a, write: "b", move: R}
  - {state: q_match_a, read: "#", next: q_move_right_a, write: "#", move: R}
  - {state: q_match_a, read: "B", next: q_move_right_a, write: "#", move: R} # İlk defa '#' koyuluyor

  # '#' işaretinden sonraki ilk boşluğa (B) 'a' harfini yaz ve geri dönmeye başla
  - {state: q_move_right_a, read: "a", next: q_move_right_a, write: "a", move: R}
  - {state: q_move_right_a, read: "b", next: q_move_right_a, write: "b", move: R}
  - {state: q_move_right_a, read: "B", next: q_return, write: "a", move: L}

  # 'b' harfini kopyalamak için sağa, '#' işaretinin sonrasına ilerle
  - {state: q_match_b, read: "a", next: q_match_b, write: "a", move: R}
  - {state: q_match_b, read: "b", next: q_match_b, write: "b", move: R}
  - {state: q_match_b, read: "#", next: q_move_right_b, write: "#", move: R}
  - {state: q_match_b, read: "B", next: q_move_right_b, write: "#", move: R}

  # '#' işaretinden sonraki ilk boşluğa (B) 'b' harfini yaz ve geri dönmeye başla
  - {state: q_move_right_b, read: "a", next: q_move_right_b, write: "a", move: R}
  - {state: q_move_right_b, read: "b", next: q_move_right_b, write: "b", move: R}
  - {state: q_move_right_b, read: "B", next: q_return, write: "b", move: L}

  # En soldaki işaretli harflere (A veya B') ulaşana kadar sola geri dön
  - {state: q_return, read: "a", next: q_return, write: "a", move: L}
  - {state: q_return, read: "b", next: q_return, write: "b", move: L}
  - {state: q_return, read: "#", next: q_return, write: "#", move: L}
  - {state: q_return, read: "A", next: q0, write: "A", move: R} # İşaretli yeri buldun, bir sağındakinden devam et
  - {state: q_return, read: "B'", next: q0, write: "B'", move: R}

  # Kopyalama bittiğinde şeritteki büyük harf işaretleyicileri (A ve B') tekrar orijinal hallerine (a ve b) çevir
  - {state: q_clean, read: "A", next: q_clean, write: "a", move: L}
  - {state: q_clean, read: "B'", next: q_clean, write: "b", move: L}
  - {state: q_clean, read: "B", next: q_accept, write: "B", move: R}
